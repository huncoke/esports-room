<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>电竞房 3D 可视化 · 版本目录</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    min-height:100vh;
    background:#05070d radial-gradient(1200px 600px at 50% -10%, #0d1830 0%, transparent 60%);
    color:#dfe7f5;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:64px 20px 40px;
  }
  header{ text-align:center; margin-bottom:48px; }
  h1{
    font-size:34px; letter-spacing:4px; color:#fff;
    text-shadow:0 0 24px rgba(0,229,255,.45);
  }
  h1 span{ color:#00e5ff; }
  .sub{ margin-top:12px; font-size:14px; color:#7e8aa0; letter-spacing:1px; }
  main{
    display:flex; gap:28px; flex-wrap:wrap; justify-content:center;
    max-width:900px; width:100%;
  }
  .card{
    flex:1 1 340px; max-width:420px;
    display:block; text-decoration:none; color:inherit;
    background:linear-gradient(160deg, rgba(14,20,38,.85), rgba(8,12,25,.85));
    border:1px solid rgba(0,229,255,.18);
    border-radius:16px; padding:30px 28px;
    transition:transform .25s, border-color .25s, box-shadow .25s;
    position:relative; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:160px; height:2px;
    background:linear-gradient(90deg, transparent, #00e5ff, transparent);
    box-shadow:0 0 14px #00e5ff; opacity:.7;
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:rgba(0,229,255,.5);
    box-shadow:0 18px 48px rgba(0,0,0,.55), 0 0 32px rgba(0,229,255,.12);
  }
  .ver{
    display:inline-block; padding:4px 14px; border-radius:12px;
    font-size:12px; letter-spacing:2px;
    background:rgba(0,229,255,.1); border:1px solid rgba(0,229,255,.35);
    color:#00e5ff; margin-bottom:16px;
  }
  .card.v2 .ver{ background:rgba(255,140,60,.1); border-color:rgba(255,140,60,.35); color:#ff8c3c; }
  .card.v2::before{ background:linear-gradient(90deg, transparent, #ff8c3c, transparent); box-shadow:0 0 14px #ff8c3c; }
  .card h2{ font-size:22px; color:#fff; margin-bottom:10px; letter-spacing:1px; }
  .card p{ font-size:13.5px; line-height:1.8; color:#9fb0c8; }
  .go{
    display:inline-block; margin-top:20px; font-size:14px; color:#00e5ff;
    letter-spacing:1px;
  }
  .card.v2 .go{ color:#ff8c3c; }
  footer{
    margin-top:56px; font-size:12px; color:#4d5a72; letter-spacing:1px; text-align:center;
    line-height:2;
  }
</style>
</head>
<body>
  <header>
    <h1><span>//</span> 电竞房 3D 可视化</h1>
    <div class="sub">5.2m × 3.76m × 2.9m · 暗调木质电竞 × 观影双区 · Three.js 纯代码几何体</div>
  </header>
  <main>
    <a class="card" href="v1/">
      <span class="ver">初版</span>
      <h2>电竞房初版</h2>
      <p>霓虹赛博风。左侧硬件清单，点击任意设备弹出参数卡片，发光高亮 + 相机聚焦，4 个预设视角一键切换。</p>
      <span class="go">进入 →</span>
    </a>
    <a class="card v2" href="v2/">
      <span class="ver">二版</span>
      <h2>电竞房二版</h2>
      <p>UNIT-01 工业剖面检视风。右侧详情抽屉，墙体 / 标注 / 尺寸 / 拆解显示开关，5 个视角，夜间模式。</p>
      <span class="go">进入 →</span>
    </a>
  </main>
  <footer>
    建议用电脑 Chrome / Edge 打开，拖拽旋转 · 滚轮缩放 · 右键平移<br>
    手机能看，但体验打折
  </footer>
</body>
</html>
